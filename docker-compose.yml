# Phase 19: local stack
# Usage:
#   cp server/.env.example server/.env   # fill MONGO_URI, JWT_SECRET
#   docker compose up --build
#
# Mongo can be Atlas (MONGO_URI in server/.env) or the local mongo service below.

services:
  api:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Override if using compose mongo:
      # MONGO_URI: mongodb://mongo:27017/nutrivibe
      CLIENT_URL: http://localhost:8080
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional local Mongo (comment out if using Atlas only)
  # mongo:
  #   image: mongo:7
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    # API works without Redis; set REDIS_URL=redis://redis:6379 in server/.env to use it

# volumes:
#   mongo_data:
